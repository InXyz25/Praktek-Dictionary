<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dictionary</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            margin-top: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #222;
            color: white;
        }

        #result {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>📖 My Dictionary</h1>

    <input
        type="text"
        id="word"
        placeholder="Masukkan kata..."
    >

    <button onclick="searchWord()">
        Cari
    </button>

    <div id="result"></div>
</div>

<script>
function searchWord() {

    let word = document.getElementById("word").value;

    document.getElementById("result").innerHTML =
        "Kamu mencari: <b>" + word + "</b>";
}
</script>

</body>
</html>
